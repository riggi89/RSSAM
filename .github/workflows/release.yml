name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Run unit tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -CollectCoverage

      - name: Build x86, x64 and installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Configuration Release

      - name: Build portable archives
        shell: pwsh
        run: ./scripts/build-portable.ps1 -Configuration Release -SkipPublish

      - name: Build source archive
        shell: pwsh
        run: ./scripts/build-source-zip.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RSSAM-Windows-${{ github.ref_name }}
          path: |
            artifacts/installer/*.exe
            artifacts/portable/*.zip
            artifacts/source/*.zip

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "RSSAM ${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" artifacts/installer/*.exe artifacts/portable/*.zip artifacts/source/*.zip --clobber
